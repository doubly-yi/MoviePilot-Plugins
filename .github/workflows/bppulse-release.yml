name: bp PULSE Plugin Release
on:
  push:
    branches: [main]
    paths: ['package.v2.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend
        run: |
          python -m pip install -r tests/v2/bppulsesignin/requirements.txt
          python -m pytest tests/v2/bppulsesignin -q
      - name: Build frontend
        working-directory: plugins.v2/bppulsesignin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Validate and package
        run: python tools/package_bppulse.py
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("package.v2.json"))["BpPulseSignin"]["version"])')
          tag="BpPulseSignin_v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; increase the plugin version for another release."
            exit 0
          fi
          python -c 'import json; p=json.load(open("package.v2.json"))["BpPulseSignin"]; print(p["history"]["v"+p["version"]])' > .release/notes.md
          gh release create "$tag" ".release/bppulsesignin_v${version}.zip" --target "$GITHUB_SHA" --title "bp PULSE 签到 ${version}" --notes-file .release/notes.md
